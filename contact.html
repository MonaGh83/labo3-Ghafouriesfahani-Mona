    <nav class="nav" id="nav">
        <a href="index.html">Accueil</a>

    </nav>

</header>


<!-- CONTACT -->
<section class="contact" id="contact">

    <div class="contact-container">

        <h2 style="text-align: center; padding-bottom: 50px;">
            Créons quelque chose<br>
            de <em>beau.</em>
        </h2>

        <p class="contact-intro">
            Vous avez une idée, une question ou simplement envie de discuter de votre séance ?
        </p>

        <!-- Message de confirmation ou d'erreur -->
        <p id="formMessage" role="status" aria-live="polite"></p>

        <!-- FORMULAIRE -->
        <form id="contactForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        autocomplete="given-name"
                        required>
                </div>

                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        autocomplete="family-name"
                        required>
                </div>

            </div>

            <div class="form-group">
                <label for="email">Courriel</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="type">Type de séance</label>

                <select id="type" name="type" required>

                    <option value="">Choisissez une option</option>
                    <option value="maternite">Maternité</option>
                    <option value="famille">Famille</option>
                    <option value="portrait">Portrait</option>
                    <option value="autre">Autre</option>

                </select>
            </div>

            <div class="form-group">
                <label for="message">Votre message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required></textarea>
            </div>

            <button type="submit" class="button submit-button">
                Envoyer ma demande
            </button>

        </form>

    </div>

</section>


<!-- FOOTER -->
<footer>

    <div class="footer-logo">
