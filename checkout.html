
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"  content="width=device-width, initial-scale=1.0">

    <title>Monalisa Studio — Checkout</title>

    <meta name="description" content="Finalisez votre sélection de photographies — Monalisa Studio.">


    <!-- Google Fonts -->

    <link rel="preconnect"  href="https://fonts.googleapis.com">

    <link rel="preconnect"  href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap"  rel="stylesheet">


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Main CSS -->

   
    <link rel="stylesheet" href="CSS/checkout.css">

</head>


<body>


   <!-- ================= HEADER ================= -->

<header class="header">

    <a href="#accueil" class="logo">
        Monalisa
        <span>STUDIO PHOTOGRAPHY</span>
    </a>

    <button class="menu-button" id="menuButton" aria-label="Ouvrir le menu">
        ☰
    </button>
    

    <nav class="nav" id="nav">

        <a href="index.html">Accueil</a>
        <a href="main.html">Main</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="checkout.html">Checkout</a>
        <!-- Theme Toggle Inside Navigation --> 
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Activer le thème sombre" title="Changer le thème"> ☾ </button>

    </nav>

</header>




    <!-- =================================================
         CHECKOUT
    ================================================= -->

    <main class="checkout-page">


        <div class="checkout-title">

            <h1>
                Votre sélection
            </h1>

            <p>
                Finalisez votre sélection de photographies
            </p>

        </div>



        <!-- =================================================
             SELECTED PHOTOS
        ================================================= -->

        <section class="selected-photos">

            <h2>
                Photographies sélectionnées
            </h2>


            <div id="photosSelected"></div>


            <div class="checkout-total">

                <span>
                    Total
                </span>

                <strong>

                    <span id="totalPrice">
                        0.00
                    </span>

                    $

                </strong>

            </div>

        </section>



        <!-- =================================================
             FORM
        ================================================= -->

        <section
            class="checkout-form-section"
            id="checkoutFormSection">

            <h2>
                Vos informations
            </h2>


            <form id="checkoutForm">


                <div class="form-group">

                    <label for="prenom">
                        Prénom
                    </label>

                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        required>

                </div>


                <div class="form-group">

                    <label for="nom">
                        Nom
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>

                </div>


                <button
                    type="submit"
                    class="checkout-submit">

                    Confirmer ma sélection

                </button>

            </form>

        </section>



        <!-- =================================================
             RECEIPT
        ================================================= -->

        <section
            id="finalReceipt"
            class="final-receipt">

        </section>


    </main>
 <script src="Js/checkout.js"></script> 
 

</body>

</html>
